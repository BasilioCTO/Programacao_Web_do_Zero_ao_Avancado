<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iframes</title>
</head>

<body>
    <H1>Iframes</H1><br>

    <iframe width="560" height="315" src="https://www.youtube.com/embed/448sdzWsnMs?si=48r3PAByUaECgpHy"
        title="YouTube video player" frameborder="0"
        allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
        referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe><br>

    <p>Iframes da-nos a posibilidade de rodar um site externo dentro de uma pagina ou site principal
        <br>Sua representação:
    </p>

    <!--Sua estrutura-->
    <iframe style="border:none;" src="Exercicios_de_HTML/primeiro_exercicio_index.html" width="728" height="400"
        title=""></iframe><br>

    <a href="Exemplo_usado_no_arquivo_Links_index/Exemplo_do_RM_index.html" target="Meu Iframe">Sobre o Real
        Madrid</a><br>

    <!--Fazendo com que um link abra na mesma pagina como se fosse um iframe-->
    <iframe src="" name="Meu Iframe" title="Exemplo do comentario acima" frameborder="0"></iframe><br>
</body>

</html>
