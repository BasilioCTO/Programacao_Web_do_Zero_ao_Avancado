<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tela Login</title>
    <link rel="stylesheet" href="../../Arquivos_de_css/Meus_Brinquedos_de_CSS/Tela_de_login_Modern2.css">
</head>

<body>
    <div class="container">

        <h1>login</h1>

        <form>
            <div class="usuario">
                <input type="text" id="user-name" required>
                <label for="user-name">Username</label>
            </div>


            <div class="senha">
                <input type="password" id="password" required>
                <label for="password">Password</label>
            </div>

            <div class="lembrar-senha">
                <label for="lembrar-senha">
                    <input type="checkbox" id="lembrar-senha">
                    Mostrar senha
                </label>

                <a href="#">Esqueci a senha</a>
            </div>

            <button type="submit" class="botao-login">login</button>

            <p class="registro">Não tem conta ? <a href="#">Criar conta</a></p>
        </form>
    </div>
</body>

</html>
