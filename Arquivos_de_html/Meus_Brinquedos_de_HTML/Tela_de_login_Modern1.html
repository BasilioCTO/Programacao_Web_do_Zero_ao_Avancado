<!DOCTYPE html>

<head>

<body>
    <div class="container">
        <h1>Login|Entrar</h1>

        <form>
            <div class="input-user">
                <input type="email" autocomplete="email" placeholder="E-mail" required>
            </div>

            <div class="input-user">
                <input type="password" autocomplete="current-password" placeholder="Senha" required>
            </div>

            <div class="div-lembrar-senha">
                <label>
                    <input type="checkbox">
                    Mostrar senha
                </label>
                <a href="#">Esqueci a senha</a></p>
            </div>

            <button type="submit">Login</button>

            <div class="registro">
                <p>Não tem conta? <a>Registrar</a></p>
            </div>
        </form>
    </div>
</body>

</html>
