<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login|Modern</title>
    <link rel="stylesheet" href="../../Arquivos_de_css/Meus_Brinquedos_de_CSS/Tela_de_login_Modern4.css">
</head>

<body>
    <main class="container">
        <form action="#" class="form-login">
            <h1>Entrar</h1>

            <div class="form-group">
                <input type="email" id="user-email" required autocomplete="name">
                <label for="user-email">Email</label>
            </div>

            <div class="form-group">
                <input type="password" id="user-password" required autocomplete="current-password">
                <label for="user-email">palavra passe</label>
            </div>

            <div class="mostrar-lembrar-senha">
                <label for="mostrar-senha">
                    <input type="checkbox" id="mostrar-senha">
                    Mostrar senha
                </label>

                <a href="#">Esqueci a senha</a>
            </div>

            <div class="botao-login">
                <button type="submit">Entrar</button>
            </div>

            <div class="registar">
                <p>Não tem conta? <a href="#"> Criar conta</a></p>
            </div>
        </form>
    </main>
</body>

</html>
