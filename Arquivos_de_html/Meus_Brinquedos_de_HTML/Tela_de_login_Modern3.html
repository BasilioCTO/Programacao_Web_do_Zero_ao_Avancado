<!DOCTYPE html>
<html lang="pt-pt">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login|Modern</title>
    <link rel="stylesheet" href="../../Arquivos_de_css/Meus_Brinquedos_de_CSS/Tela_de_login_Modern3.css">
</head>

<body>
    <div class="container-login">
        <div class="form-box login">
            <form action="#">
                <h1>Login</h1>
                <div class="div-user-senha">
                    <span><ion-icon name="person-circle-outline"></ion-icon></span>
                    <input type="text" required autocomplete="name">
                    <label>Username</label>
                </div>

                <div class="div-user-senha">
                    <ion-icon name="lock-closed-outline"></ion-icon>
                    <input type="password" required autocomplete="current-password">
                    <label>Password</label>
                </div>

                <div class="lembrar-e-esquci-senha">
                    <label>
                        <input type="checkbox">
                        Mostrar senha
                    </label>

                    <a href="#">Esqueci a senha</a>
                </div>

                <div class="botao">
                    <button type="submit">login</button>
                </div>

                <p class="criar-conta">Não tenho conta. <a href="#">Criar conta</a></p>
            </form>
        </div>
    </div>

    <script type="module" src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@8.0.13/dist/ionicons/ionicons.js"></script>
</body>

</html>
